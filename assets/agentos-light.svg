</style><rect x=".5" y=".5" width="879" height="309" rx="16" fill="#ffffff" stroke="#d0d7de"/><text x="36" y="48" class="cap">NOW BUILDING</text><text x="36" y="80" class="s ink" font-size="26" font-weight="800" letter-spacing="-.02em">AgentOS</text><text x="36" y="108" class="s mu" font-size="13.5">Every AI agent breaks somewhere</text><text x="36" y="126" class="s mu" font-size="13.5">between build, ship and improve.</text><text x="36" y="144" class="s ink" font-size="13.5" font-weight="700">AgentOS fixes all three behind one URL.</text><rect x="36" y="190" width="170" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="52" y="219" class="s ink" font-size="14.5" font-weight="700">Your agent</text><text x="52" y="241" class="m" font-size="10.5" fill="#59636e">LangGraph · OpenAI SDK</text><path d="M206 225 H 300" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 4"/><path d="M294 219 L302 225 L294 231" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="253" y="214" text-anchor="middle" class="m" font-size="9.5" fill="#0f766e">one base URL</text><rect x="306" y="28" width="548" height="254" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="324" y="56" class="cap">ONE ENDPOINT · FEATURES SWITCH ON PER AGENT</text><text x="836" y="56" text-anchor="end" class="m" font-size="10.5" fill="#818b98">Rust · Python · TS</text><line x1="324" x2="836" y1="72" y2="72" stroke="#d0d7de"/><rect x="322" y="86" width="166" height="82" rx="9" fill="#ffffff" stroke="#d0d7de"/><text x="336" y="109" class="s ink" font-size="14" font-weight="700">Govrix</text><text x="476" y="109" text-anchor="end" class="m" font-size="9.5" fill="#818b98">gateway</text><text x="336" y="131" class="s mu" font-size="11.5">Budgets checked before</text><text x="336" y="147" class="s mu" font-size="11.5">the model; kill switch</text><rect x="500" y="86" width="166" height="82" rx="9" fill="#ffffff" stroke="#d0d7de"/><text x="514" y="109" class="s ink" font-size="14" font-weight="700">ChunkScope</text><text x="654" y="109" text-anchor="end" class="m" font-size="9.5" fill="#818b98">RAG</text><text x="514" y="131" class="s mu" font-size="11.5">Picks the best chunking</text><text x="514" y="147" class="s mu" font-size="11.5">and retrieval per file</text><rect x="678" y="86" width="166" height="82" rx="9" fill="#ffffff" stroke="#d0d7de"/><text x="692" y="109" class="s ink" font-size="14" font-weight="700">Inference</text><text x="832" y="109" text-anchor="end" class="m" font-size="9.5" fill="#818b98">vLLM</text><text x="692" y="131" class="s mu" font-size="11.5">Self-hosted; preempts</text><text x="692" y="147" class="s mu" font-size="11.5">batch for realtime</text><rect x="322" y="180" width="255" height="82" rx="9" fill="#ffffff" stroke="#d0d7de"/><text x="336" y="203" class="s ink" font-size="14" font-weight="700">Code sandbox</text><text x="565" y="203" text-anchor="end" class="m" font-size="9.5" fill="#818b98">Docker</text><text x="336" y="225" class="s mu" font-size="11.5">PII-scanned, caps dropped,</text><text x="336" y="241" class="s mu" font-size="11.5">egress denied by default</text><rect x="589" y="180" width="255" height="82" rx="9" fill="#ffffff" stroke="#d0d7de"/><text x="603" y="203" class="s ink" font-size="14" font-weight="700">Skills + evals</text><text x="832" y="203" text-anchor="end" class="m" font-size="9.5" fill="#818b98">registry</text><text x="603" y="225" class="s mu" font-size="11.5">Repeated traces become</text><text x="603" y="241" class="s mu" font-size="11.5">skills, gated by evals</text></svg>
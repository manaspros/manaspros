<svg xmlns="http://www.w3.org/2000/svg" width="430" height="232" viewBox="0 0 430 232" role="img" aria-label="Found: the success dashboard everyone trusted showed 59.6%; the real rate was 89%. I traced it run by run and added a bounded retry."><title>Found: the success dashboard everyone trusted showed 59.6%; the real rate was 89%. I traced it run by run and added a bounded retry.</title><style>
.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.ink{fill:#e6edf3} .mu{fill:#9198a1} .fa{fill:#6e7681}
.cap{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:10.5px;letter-spacing:.09em;fill:#6e7681}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.bar{transform-box:fill-box;transform-origin:left center;animation:grow 1.2s cubic-bezier(.2,.7,.2,1) both}
.d2{animation-delay:.25s}
.fade{animation:fade 1s ease-out .3s both}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
